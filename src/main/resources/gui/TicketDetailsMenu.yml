title: "&eTicket Details"
rows: 6

fillers:
  general:
    enabled: true
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: " "
  top-row:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  bottom-row:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "

details:
  id:
    material: NAME_TAG
    name: "&7Ticket Id"
    lore:
      - "&7 %ticket-id%"
  owner-name:
    material: PLAYER_HEAD
    name: "&7Owner Name"
    lore:
      - "&8Name : &7%owner-name%"
  status:
    material: CANDLE
    name: "Status"
    lore:
      - "&8Status : &7%status%"
  category:
    material: BOOK
    name: "Category"
    lore:
      - "&8Category : &7%category%"
  description:
    material: PAPER
    name: "Description"
    lore:
      - "&7%description%"
  creation-date:
    material: CLOCK
    name: "Creation Date"
    lore:
      - "&7%creation-date%"
  staff-name:
    material: PLAYER_HEAD
    name: "Staff"
    lore:
      - "Staff Name : %staff-name%"
  assignation-date:
    material: CLOCK
    name: "Assignation Date"
    lore:
      - "&7%assignation-date%"
  resolve-date:
    material: CLOCK
    name: "Resolve Date"
    lore:
      - "&7%resolve-date%"
  participants:
    material: TERRACOTTA
    name: "Participants"
    lore:
      - "&7%participants%"

buttons:

  claim:
    material: NAME_TAG
    name: "&aTicketı Sahiplen"
    lore:
      - "&7Bu ticketı üzerinize alın."
      - "&8[Yetkililer için görünür]"

  mark-as-resolved:
    material: GREEN_WOOL
    name: "&aÇözüldü Olarak İşaretle"
    lore:
      - "&7Ticketı çözüldü olarak işaretlemek için tıkla."

  join-participants:
    material: PLAYER_HEAD
    name: "&aKatıl"
    lore:
      - "&7Bu ticketın çözümüne katkı sağlamak için katıl."
      - "&8[Yalnızca yetkililer için]"

  leave-participants:
    material: BARRIER
    name: "&cAyrıl"
    lore:
      - "&7Bu ticketın çözümünden ayrılmak için tıkla."
      - "&8[Yalnızca katılımcılar için]"

  unclaim:
    material: PAPER
    name: "&eSahipliği Bırak"
    lore:
      - "&7Ticket üzerindeki sahipliği bırakmak için tıkla."
      - "&8[Yalnızca ticket sahibi yetkililer için]"

  cancel-ticket:
    material: REDSTONE_BLOCK
    name: "&cTicketı İptal Et"
    lore:
      - "&7Bu ticketı iptal etmek için tıkla."

  ping-staff-enabled:
    material: BELL
    name: "&eYetkililere Bildir"
    lore:
      - "&7Bir yetkili henüz bu ticketı almadı."
      - "&aTıklayarak yetkililere ping atabilirsin."

  ping-staff-cooldown:
    material: CLOCK
    name: "&6Bekleme Süresi"
    lore:
      - "&7Ping atmak için biraz beklemelisin."
      - "&fKalan süre: &e%cooldown%s"